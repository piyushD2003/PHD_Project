{% extends 'labtest/base.html' %}
{% block labtest_base %}
<div class="container mt-4">
    <h2>{{ form_title }}</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Submit Report</button>
    </form>
</div>
{% endblock %}
