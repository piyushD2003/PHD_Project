{% extends 'insurance/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block insurance_base %}

<div class="container-fluid py-4">
    <div class="card mx-auto" style="width: fit-content;">
        <div class="card-body">
            <h1 style="font-family: Ubuntu, sans-serif; text-align: center;" class="mb-3">Edit Insurance Officer Profile</h1>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Name -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Name" name="name" value="{{ form.name.value }}">
                        </div>
                    </div>
                </div>

                <!-- Phone -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <div class="input-group-text">+91</div>
                            </div>
                            <input type="tel" class="form-control" pattern="[1-9]{1}[0-9]{9}" placeholder="Phone Number" name="phone" value="{{ form.phone.value }}">
                        </div>
                        <small>{{ form.phone.help_text }}</small>
                    </div>
                </div>

                <!-- Address -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Address" name="address" value="{{ form.address.value }}">
                        </div>
                    </div>
                </div>

                <!-- Department -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Department" name="department" value="{{ form.department.value }}">
                        </div>
                    </div>
                </div>

                <!-- Company Name -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Company Name" name="company_name" value="{{ form.company_name.value }}">
                        </div>
                    </div>
                </div>

                <!-- Profile Picture -->
                <div class="form-group row">
                    <div class="col-sm my-2">
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="profilepicinput" name="profile_pic">
                            <label class="custom-file-label" for="profilepicinput">Profile Picture</label>
                        </div>
                    </div>
                </div>

                <script>
                    $(".custom-file-input").on("change", function () {
                        var fileName = $(this).val().split("\\").pop();
                        $(this).siblings(".custom-file-label").addClass("selected").html(fileName);
                    });
                </script>

                <button class="btn btn-success" type="submit">Save</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
