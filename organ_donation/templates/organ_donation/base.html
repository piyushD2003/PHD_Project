{% extends 'patient/base.html' %}
{% load static %}

{% block patient_base %}
<div class="content-wrapper">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    {% endif %}

    {% block organ_donation_content %}{% endblock %}
</div>

<style>
    .content-wrapper {
        margin-left: 200px;
        padding: 20px;
        flex: 1;
    }

    @media screen and (max-width: 950px) {
        .content-wrapper {
            margin-left: 0;
        }
    }

    .card-header {
        background: linear-gradient(90deg, #24a19c, #cedebd);
        color: white;
        border: none;
    }

    .btn-primary {
        background: #24a19c;
        border: none;
    }

    .btn-primary:hover {
        background: #1f8680;
    }

    .badge-primary {
        background: #24a19c;
    }

    .table-hover tbody tr:hover {
        background-color: #f0f0f0;
    }
</style>
{% endblock %}
